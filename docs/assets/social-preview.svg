<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Opsmira: your server, in plain words">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1513"/>
      <stop offset="1" stop-color="#16251f"/>
    </linearGradient>
    <linearGradient id="mark" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4aae7c"/>
      <stop offset="1" stop-color="#1f7f86"/>
    </linearGradient>
    <radialGradient id="glowA" cx="1090" cy="30" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4aae7c" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4aae7c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="110" cy="640" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f7f86" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1f7f86" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowB)"/>

  <g transform="translate(96 132) scale(3)">
    <rect width="64" height="64" rx="15" fill="url(#mark)"/>
    <path d="M50 32A18 18 0 1 1 32 14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="44.7" cy="19.3" r="5.4" fill="#d9fbe9"/>
  </g>

  <g font-family="'Space Grotesk','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <text x="96" y="392" font-size="96" font-weight="700" fill="#f2f6f4" letter-spacing="-2">Opsmira</text>
    <text x="100" y="448" font-size="32" font-weight="500" fill="#9fd9bb">Your server, in plain words.</text>
    <text x="100" y="496" font-size="21" fill="#9bb0a8">Ask in plain words. Every change waits for your approval.</text>
    <text x="100" y="528" font-size="21" fill="#9bb0a8">One command connects a server. MCP lets other AI agents in.</text>
    <text x="96" y="596" font-size="19" fill="#6f837c">github.com/DevBash1/opsmira · AGPL-3.0 · self-hosted</text>
  </g>
