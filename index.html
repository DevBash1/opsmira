<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9f7" />
    <meta name="apple-mobile-web-app-title" content="Opsmira" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Console theme before first paint (no light flash): the saved choice, else the system setting.
      // Kept in step with src/lib/theme.ts.
      (function () {
        if (!location.pathname.startsWith("/app")) return;
        try {
          var saved = localStorage.getItem("opsmira_theme");
          var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (!dark) return;
          document.documentElement.classList.add("theme-dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111614");
        } catch (e) {}
      })();
    </script>
    <title>Opsmira — Your server, in plain words.</title>
    <meta name="description" content="Open source AI operator console for the servers you run. Ask in plain words, watch it inspect, and approve every change. Self-hosted, AGPL-3.0." />
    <meta property="og:title" content="Opsmira: your server, in plain words" />
    <meta property="og:description" content="Ask a question about your server. Opsmira looks, shows what it found, and asks before it changes anything." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
