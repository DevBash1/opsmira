# Publishes the current main branch as ghcr.io/<owner>/opsmira:edge, so the Docker image tracks the code
# without waiting for a tagged release (releases publish :latest and the version tags, see release.yml).
name: Image
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
