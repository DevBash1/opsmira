# OFF for now: CLA.md has not had a legal review, so outside pull requests are not asked to sign it.
# To turn it back on once it has, restore the triggers below (they are kept in the comment) and delete the
# workflow_dispatch line.
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_target:
#       types: [opened, closed, synchronize]
#
# Asks people outside the maintainer team to sign CLA.md on their first pull request.
# Signatures are stored in signatures/version1/cla.json on main (the bot commits to main, so main cannot
# require pull requests for this bot; move signatures to a separate private repo if you protect main).
# NOTE: contributor-assistant/github-action is archived by its author. v2.6.1 still works; pin it, and
# replace it (fork, or the hosted CLA Assistant app) if it breaks.
name: CLA Assistant
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: github.event_name == 'workflow_dispatch' || (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/DevBash1/opsmira/blob/main/CLA.md
          branch: main
          allowlist: DevBash1,dependabot[bot],github-actions[bot]
