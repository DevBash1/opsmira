# Publishes the open source landing page (and install.sh) to GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions. Pages needs a public repository on a free plan,
# so while the repository is private this workflow skips itself.
name: Pages
on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "index.html", "vite.config.ts", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the static site
        # Served at https://<owner>.github.io/<repo>/
        run: SITE_BASE=/${{ github.event.repository.name }}/ npm run build:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
