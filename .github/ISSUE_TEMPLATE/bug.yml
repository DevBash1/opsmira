name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Opsmira version
      placeholder: "0.1.0, or a commit"
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Docker, npm start, npm run dev, systemd, Other]
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: anthropic/claude-sonnet-5.5
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets, hostnames and anything private first.
